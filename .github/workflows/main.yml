name: Main - apply policies to environments in https://app.kosli.com

on:
  push:
    branches:
      - main

env:
  KOSLI_ORG:       ${{ vars.KOSLI_ORG }}               # cyber-dojo
  KOSLI_HOST:      ${{ vars.KOSLI_HOST }}              # https://app.kosli.com
  KOSLI_API_TOKEN: ${{ secrets.KOSLI_API_TOKEN }}
  KOSLI_DRY_RUN:   ${{ vars.KOSLI_DRY_RUN }}           # false
  KOSLI_DEBUG:     ${{ vars.KOSLI_DEBUG }}             # false
  KOSLI_AWS_BETA:  aws-beta
  KOSLI_AWS_PROD:  aws-prod

jobs:

  apply-policies-to-environments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v2
        with:
          version: ${{ vars.KOSLI_CLI_VERSION }}

      - name: Detach policies from environments
        run: |
          kosli detach-policy live-snyk-scan-aws-beta --environment="${KOSLI_AWS_BETA}"
          kosli detach-policy live-snyk-scan-aws-prod --environment="${KOSLI_AWS_PROD}"

      - name: Create/Update Kosli Policies
        run: |
          kosli create policy build-process      policies/build-process.yml
          kosli create policy snyk-scan-aws-beta policies/snyk-scan-aws-beta.yml
          kosli create policy snyk-scan-aws-prod policies/snyk-scan-aws-prod.yml

      - name: Attach policies to environments
        run: |
          kosli attach-policy build-process      --environment="${KOSLI_AWS_BETA},${KOSLI_AWS_PROD}"
          kosli attach-policy snyk-scan-aws-beta --environment="${KOSLI_AWS_BETA}"
          kosli attach-policy snyk-scan-aws-prod --environment="${KOSLI_AWS_PROD}"
