name: Main - apply policies to environments in https://app.kosli.com

on:
  push:
    branches:
      - main

env:
  KOSLI_ORG:       ${{ vars.KOSLI_ORG }}               # cyber-dojo
  KOSLI_HOST:      ${{ vars.KOSLI_HOST }}              # https://app.kosli.com
  KOSLI_API_TOKEN: ${{ secrets.KOSLI_API_TOKEN }}
  KOSLI_DRY_RUN:   ${{ vars.KOSLI_DRY_RUN }}           # false
  KOSLI_DEBUG:     ${{ vars.KOSLI_DEBUG }}             # false

  KOSLI_AWS_BETA:     aws-beta
  KOSLI_AWS_BETA_TF:  aws-beta-terraform-drift-detection
  KOSLI_AWS_PROD:     aws-prod
  KOSLI_AWS_PROD_TF:  aws-prod-terraform-drift-detection

jobs:

  apply-policies-to-environments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: ${{ vars.KOSLI_CLI_VERSION }}

      # - name: Detach policies from environments
      #   run: |
      #     kosli detach-policy terraform-state-differ-prod --environment="${KOSLI_AWS_BETA},${KOSLI_AWS_PROD}"
      #     kosli detach-policy terraform-state-differ-beta --environment="${KOSLI_AWS_BETA},${KOSLI_AWS_PROD}"

      - name: Create/Update Kosli Policies
        run: |
          kosli create policy provenance           policies/provenance.yml
          kosli create policy pull-request         policies/pull-request.yml
          kosli create policy trail-compliance-aws-beta policies/trail-compliance-aws-beta.yml
          kosli create policy trail-compliance-aws-prod policies/trail-compliance-aws-prod.yml
          kosli create policy snyk-scan-aws-beta   policies/snyk-scan-aws-beta.yml
          kosli create policy snyk-scan-aws-prod   policies/snyk-scan-aws-prod.yml
          kosli create policy production-promotion policies/production-promotion.yml

      - name: Attach policies to environments
        run: |
          kosli attach-policy provenance        --environment="${KOSLI_AWS_BETA},${KOSLI_AWS_PROD}"
          kosli attach-policy provenance        --environment="${KOSLI_AWS_BETA_TF},${KOSLI_AWS_PROD_TF}"
          kosli attach-policy pull-request      --environment="${KOSLI_AWS_BETA},${KOSLI_AWS_PROD}"
          kosli attach-policy trail-compliance-aws-beta --environment="${KOSLI_AWS_BETA}"
          kosli attach-policy trail-compliance-aws-prod --environment="${KOSLI_AWS_PROD}"
          kosli attach-policy snyk-scan-aws-beta   --environment="${KOSLI_AWS_BETA}"
          kosli attach-policy snyk-scan-aws-prod   --environment="${KOSLI_AWS_PROD}"
          kosli attach-policy production-promotion --environment="${KOSLI_AWS_PROD}"
