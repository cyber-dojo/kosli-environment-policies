_schema: https://kosli.com/schemas/policy/environment/v1

# https://docs.kosli.com/getting_started/policies/#trail-compliance

artifacts:
  trail-compliance:
    required: true
    if: ${{ flow.tags.kind == "build" }}
  attestations:
    - name: '*'
      type: snyk
      if: ${{ flow.tags.kind == "build" }}
